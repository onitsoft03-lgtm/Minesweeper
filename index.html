<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지뢰찾기</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <header>
            <h1>지뢰찾기</h1>
            <div class="stats">
                <div class="stat-box">
                    <span class="label">점수</span>
                    <span id="score" class="value">0</span>
                </div>
                <div class="stat-box">
                    <span class="label">시간</span>
                    <span id="timer" class="value">--</span>
                </div>
                <div class="stat-box">
                    <span class="label">클리어</span>
                    <span id="clear-count" class="value">0</span>
                </div>
                <div class="stat-box">
                    <span class="label">실패</span>
                    <span id="fail-count" class="value">0</span>
                </div>
            </div>
            <div class="controls">
                <button id="btn-beginner" class="btn active">초급 (8x8)</button>
                <button id="btn-intermediate" class="btn">중급 (10x10)</button>
                <button id="btn-advanced" class="btn">상급 (16x16)</button>
                <button id="btn-expert" class="btn">최상급 (20x20)</button>
                <button id="btn-impossible" class="btn">불가능 (50x50)</button>
                <button id="btn-restart" class="btn primary">다시하기</button>
            </div>
        </header>

        <main>
            <div id="game-board" class="board beginner"></div>
        </main>
        
        <div id="game-over-modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="modal-title">결과</h2>
                <p id="modal-message"></p>
                <p>소요 시간: <span id="modal-time"></span>초</p>
                <p>실패 횟수: <span id="modal-fail-count"></span>회</p>
                <button id="modal-btn-restart" class="btn primary">다시하기</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
